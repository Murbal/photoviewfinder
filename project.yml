name: PhotoViewfinder
options:
  bundleIdPrefix: com.murbal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoViewfinder:
    type: application
    platform: iOS
    sources:
      - path: PhotoViewfinder
    scheme: {}
    info:
      path: PhotoViewfinder/Info.plist
      properties:
        CFBundleDisplayName: Viewfinder
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: The camera shows the live scene so you can preview framing at different focal lengths.
        NSPhotoLibraryAddUsageDescription: Saves framed shots to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murbal.photoviewfinder
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Set your (free) Apple ID team here, or pick it in Xcode → Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
